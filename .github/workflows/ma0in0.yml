name: Build TouchDirt Kernel - Non-GKI Samsung A04

on:
  workflow_dispatch:
    inputs:
      root_provider:
        description: 'اختر مشروَع الروت (يوصى بـ KernelSU أو SukiSU لـ 4.19)'
        required: true
        default: 'SukiSU-Ultra'
        type: choice
        options:
        - 'SukiSU-Ultra'
        - 'KernelSU-Next'
        - 'FinaSU'
        - 'KernelSU'
      version:
        description: 'رقم الإصدار (مثال: v1.0)'
        required: false
        default: 'BETA'
        type: string

  workflow_call:
    inputs:
      root_provider:
        required: false
        default: 'SukiSU-Ultra'
        type: string
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Integrate Root Engine for Non-GKI 4.19
      run: |
        ROOT_CHOICE="${{ github.event.inputs.root_provider || inputs.root_provider }}"
        echo "=========================================="
        echo "[-] Selected Root Engine: $ROOT_CHOICE"
        echo "=========================================="

        case "$ROOT_CHOICE" in
          "SukiSU-Ultra")
            git clone -b main https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            ;;
          "KernelSU-Next")
            git clone -b next https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
            ;;
          "FinaSU")
            git clone -b main https://github.com/LyraVoid/FinaSU.git KernelSU
            ;;
          "KernelSU")
            git clone -b main https://github.com/tiann/KernelSU.git KernelSU
            ;;
          *)
            git clone -b main https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            ;;
        esac

        echo "[-] Running KernelSU Setup script in 'builtin' mode..."
        chmod +x ./KernelSU/kernel/setup.sh
        ./KernelSU/kernel/setup.sh builtin

    - name: Setup SUSFS Patches
      run: |
        echo "[-] Applying SUSFS patches..."
        git clone https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd --depth 1 SUSFS
        chmod +x ./SUSFS/Patches/susfs_inline_hook_patches.sh
        ./SUSFS/Patches/susfs_inline_hook_patches.sh

    - name: Fix Missing static_call.h for Kernel 4.19
      run: |
        echo "[-] Creating compatibility stub for static_call.h in Kernel 4.19..."
        mkdir -p include/linux
        if [ ! -f "include/linux/static_call.h" ]; then
          echo "#ifndef _LINUX_STATIC_CALL_H" > include/linux/static_call.h
          echo "#define _LINUX_STATIC_CALL_H" >> include/linux/static_call.h
          echo "// Compatibility stub for older kernels (4.19)" >> include/linux/static_call.h
          echo "#endif" >> include/linux/static_call.h
        fi

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains Directories
      run: |
        mkdir -p toolchain/gcc
        mkdir -p toolchain/clang

    - name: Download GCC & Clang Toolchains
      run: |
        cd toolchain/gcc
        wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

        cd ../clang
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"

        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

        # إضافة مسارات include الجديدة لضمان قراءة الملفات الوهمية
        echo "KCFLAGS=-w -Wno-error=format -Wno-error -I$(pwd)/include -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        ROOT_CHOICE="${{ github.event.inputs.root_provider || inputs.root_provider }}"
        VERSION_TAG="${{ github.event.inputs.version || inputs.version }}"

        make -C $(pwd) O=$(pwd)/out touchdirt-a04_defconfig

        if [ -f "arch/arm64/configs/touchdirt.config" ]; then
          ./scripts/kconfig/merge_config.sh -O "$(pwd)/out" "$(pwd)/out/.config" arch/arm64/configs/touchdirt.config
        fi

        # --- حقن خيارات الروت وإجبار تفاعلها مع نواة 4.19 ---
        echo "CONFIG_KSU=y" >> $(pwd)/out/.config
        echo "CONFIG_KSU_TAMPER_SYS_PROC_ATTR=y" >> $(pwd)/out/.config
        echo "CONFIG_KALLSYMS=y" >> $(pwd)/out/.config
        echo "CONFIG_KALLSYMS_ALL=y" >> $(pwd)/out/.config
        echo "CONFIG_KPM=y" >> $(pwd)/out/.config

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' $(pwd)/out/.config
        sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-TouchDirt-${ROOT_CHOICE}-${VERSION_TAG}\"/" out/.config

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) || make -C $(pwd) O=$(pwd)/out -j1

    - name: Package AnyKernel3
      run: |
        ROOT_CHOICE="${{ github.event.inputs.root_provider || inputs.root_provider }}"
        VERSION_TAG="${{ github.event.inputs.version || inputs.version }}"
        DATE=$(date -u +"%Y-%m-%d")

        git clone https://github.com/DaniTheSillyFem/AnyKernel3 --depth 1

        cp out/arch/arm64/boot/Image AnyKernel3/Image

        cd AnyKernel3
        zip -r9 "../TouchDirt-${ROOT_CHOICE}-${VERSION_TAG}-${DATE}.zip" . -x ".git/*"

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v4
      with:
        name: TouchDirt-${{ github.event.inputs.root_provider || inputs.root_provider }}-Enforcing
        path: TouchDirt-*.zip

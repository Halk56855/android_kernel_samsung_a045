name: Build Multi-Variant Kernels with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    name: Build Kernel for ${{ matrix.target_system }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target_system: "OneUI-6.1"
            defconfig: "a04_defconfig"
            zip_name: "Kernel-KernelSU-OneUI6.1.zip"
          
          - target_system: "LineageOS-GSI"
            defconfig: "a04_00_defconfig"
            zip_name: "Kernel-KernelSU-LineageOS-GSI.zip"

          - target_system: "Rsuntk-A04"
            defconfig: "rsuntk-a04_defconfig"
            zip_name: "Kernel-KernelSU-Rsuntk-A04.zip"

          - target_system: "TouchDirt-A04"
            defconfig: "touchdirt-a04_defconfig"
            zip_name: "Kernel-KernelSU-TouchDirt-A04.zip"

          - target_system: "TouchDirt-Permissive"
            defconfig: "touchdirt-permissive-config"
            zip_name: "Kernel-KernelSU-TouchDirt-Permissive.zip"

          - target_system: "TouchDirt-Config"
            defconfig: "touchdirt.config"
            zip_name: "Kernel-KernelSU-TouchDirt-Config.zip"

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev libpixman-1-dev python3 libelf-dev clang lld llvm wget tar git

      - name: Setup Official ARM GNU Toolchain 14.2
        run: |
          echo "Downloading ARM GNU Toolchain 14.2..."
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          
          echo "Extracting toolchain..."
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          
          echo "Moving to toolchain directory..."
          mv arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu $HOME/toolchain
          
          echo "Adding to PATH..."
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: Integrate KernelSU-Next (Legacy Branch)
        run: |
          rm -rf KernelSU-Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth=1 -b v3.4.0-legacy KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh legacy

      - name: Configure and Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # 1. تطبيق ملف الـ defconfig أو الـ config الخاص بكل متغير في المصفوفة
          make O=out ${{ matrix.defconfig }}

          # 2. تفعيل خيارات KernelSU-Next و SUSFS و Kprobes إجبارياً لضمان عمل الروت
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_NEXT \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_SU_SFS \
            -e CONFIG_SU_SFS_SUSFSMANAGER \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL

          # 3. تحديث الإعدادات والتوافقية
          make O=out olddefconfig

          # 4. بدء تجميع النواة باستخدام جميع أنوية المعالج المتاحة
          make -j$(nproc --all) O=out

      - name: Pack Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          
          cd AnyKernel3
          zip -r9 "../${{ matrix.zip_name }}" * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.target_system }}
          path: ${{ matrix.zip_name }}

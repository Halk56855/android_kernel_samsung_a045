name: Build Dual Kernels (OneUI 6.1 & LineageOS) with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    name: Build Kernel for ${{ matrix.target_system }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target_system: "OneUI-6.1"
            defconfig: "a045_oneui_defconfig"  # ضع اسم ملف defconfig الخاص بروم OneUI
            zip_name: "Kernel-KernelSU-OneUI6.1.zip"
          
          - target_system: "LineageOS-GSI"
            defconfig: "a045_lineage_defconfig" # ضع اسم ملف defconfig الخاص بـ LineageOS/GSI
            zip_name: "Kernel-KernelSU-LineageOS-GSI.zip"

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libglib2.0-dev libpixman-1-dev python3 libelf-dev clang lld llvm

      - name: Setup Toolchain (Clang & GCC)
        run: |
          git clone --depth=1 https://github.com/ravindu644/arm-gnu-toolchain-14.2 $HOME/toolchain
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: Integrate KernelSU-Next
        run: |
          if [ ! -d "KernelSU-Next" ]; then
            git clone https://github.com/rifsxd/KernelSU-Next -b v3.4.0-legacy KernelSU-Next
          fi
          # تشغيل سكريبت الدمج التلقائي لـ KernelSU-Next داخل سورس النواة
          cd KernelSU-Next
          bash setup.sh
          cd ..

      - name: Configure and Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # 1. إعداد التهيئة الخاصة بالنظام المحدد في الماتريكس
          make O=out ${{ matrix.defconfig }}

          # 2. ضمان تفعيل خيارات KernelSU-Next و SUSFS في ملف الـ config النهائي
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_NEXT \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_SU_SFS \
            -e CONFIG_SU_SFS_SUSFSMANAGER \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_KPROBES

          # 3. إعادة معالجة ملف الـ config للتحقق من المكونات
          make O=out olddefconfig

          # 4. تجميع الكيرنل
          make -j$(nproc --all) O=out

      - name: Pack Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          # نسخ صورة النواة المجمعة إلى مجلد AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          
          cd AnyKernel3
          zip -r9 "../${{ matrix.zip_name }}" * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.target_system }}
          path: ${{ matrix.zip_name }}

name: Build TouchDirt Kernel, KernelSU-Next, Enforcing
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version / Tag'
        required: true
        default: 'v1.0'
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrating KernelSU-Next (Smart Symbolic Link Fix)
      run: |
        echo "[-] Fixing Symbolic Link and setting up KernelSU-Next..."
        rm -f drivers/kernelsu
        mkdir -p drivers/kernelsu
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth 1 -b next drivers/kernelsu

    - name: SUSFS & Smart Compatibility Injection
      run: |
        git clone https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd --depth 1 SUSFS
        chmod +x ./SUSFS/Patches/susfs_inline_hook_patches.sh
        ./SUSFS/Patches/susfs_inline_hook_patches.sh
        
        mkdir -p drivers/ksu_compat
        echo '#include <linux/types.h>' >

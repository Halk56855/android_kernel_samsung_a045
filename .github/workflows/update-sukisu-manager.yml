name: Sync SukiSU Manager

on:
  workflow_dispatch: 
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update SukiSU Manager
    runs-on: ubuntu-latest

    steps:
      - name: Get latest SukiSU main commit
        id: sukisu
        run: |
          SHA=$(git ls-remote \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            refs/heads/main | awk '{print $1}')

          echo "SukiSU main: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching manager build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sukisu.outputs.sha }}"

          RUN_ID=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No manager build found for $SHA"
            echo "Falling back to latest successful main build..."

            RUN_ID=$(gh api \
              "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find a successful SukiSU manager build."
            exit 1
          fi

          echo "Using manager build: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Manager artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager

          gh run download \
            "${{ steps.build.outputs.run_id }}" \
            --repo SukiSU-Ultra/SukiSU-Ultra \
            --dir manager

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bundle ksud into APK and Sign
        run: |
          echo "Downloaded artifacts list:"
          find manager -type f -print

          # 1. تحديد ملف الـ APK
          mapfile -t APKS < <(find manager -type f -path '*/Manager-gradle/*.apk')
          if [ "${#APKS[@]}" -lt 1 ]; then
            mapfile -t APKS < <(find manager -type f -iname '*.apk' ! -path '*/Spoofed-Manager*')
          fi

          RAW_APK="${APKS[0]}"
          echo "Base APK: $RAW_APK"

          # 2. تحديد ملف ksud الخاص بـ arm64
          KSUD_FILE=$(find manager -type f -path '*/ksud-aarch64-linux-android/ksud' | head -n 1)
          
          # 3. دمج ملف ksud داخل الـ APK
          mkdir -p assets
          if [ -f "$KSUD_FILE" ]; then
            echo "Found ksud: $KSUD_FILE"
            cp "$KSUD_FILE" assets/ksud
            zip -g "$RAW_APK" assets/ksud
          else
            echo "WARNING: ksud not found, proceeding without embedding."
          fi

          # 4. إنشاء مفتاح توقيع جديد
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 5. محاذاة وتوقيع الملف النهائي
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SukiSU-Manager.apk aligned.apk

          echo "Final signed APK created successfully:"
          ls -lh SukiSU-Manager.apk

      - name: Find latest TouchDirt release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: No published TouchDirt release found."
            exit 1
          fi

          echo "Latest TouchDirt release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload SukiSU Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            SukiSU-Manager.apk \
            --repo "${{ github.repository }}" \
            --clobber

name: Sync SukiSU Manager

on:
  workflow_dispatch: 
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update SukiSU Manager
    runs-on: ubuntu-latest

    steps:
      - name: Get latest SukiSU main commit
        id: resukisu
        run: |
          SHA=$(git ls-remote \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            refs/heads/main | awk '{print $1}')

          echo "SukiSU main: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching manager build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sukisu.outputs.sha }}"

          RUN_ID=$(gh api \
            "repos/SukiSU/SukiSU/actions/workflows/build-manager.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No manager build found for $SHA"
            echo "Falling back to latest successful main build..."

            RUN_ID=$(gh api \
              "repos/SukiSU/SukiSU/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find a successful ReSukiSU manager build."
            exit 1
          fi

          echo "Using manager build: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Manager-release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager

          gh run download \
            "${{ steps.build.outputs.run_id }}" \
            --repo SukiSU/SukiSU \
            --name Manager-release \
            --dir manager

      - name: Find ARM64 Manager APK
        run: |
          echo "Downloaded files:"
          find manager -type f -print

          mapfile -t APKS < <(
            find manager -type f \
              -iname '*arm64*.apk'
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one ARM64 APK, found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          cp "${APKS[0]}" SukiSU-Manager.apk

          echo "Selected ARM64 manager:"
          ls -lh SukiSU-Manager.apk

      - name: Find latest TouchDirt release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: No published TouchDirt release found."
            exit 1
          fi

          echo "Latest TouchDirt release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload SukiSU Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            SukiSU-Manager.apk \
            --repo "${{ github.repository }}" \
            --clobber

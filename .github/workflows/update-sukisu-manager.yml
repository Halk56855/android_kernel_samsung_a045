name: Sync SukiSU Manager

on:
  workflow_dispatch: 
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update SukiSU Manager
    runs-on: ubuntu-latest

    steps:
      - name: Get latest SukiSU main commit
        id: sukisu
        run: |
          SHA=$(git ls-remote \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            refs/heads/main | awk '{print $1}')

          echo "SukiSU main: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching manager build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sukisu.outputs.sha }}"

          RUN_ID=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No manager build found for $SHA"
            echo "Falling back to latest successful main build..."

            RUN_ID=$(gh api \
              "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find a successful SukiSU manager build."
            exit 1
          fi

          echo "Using manager build: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Manager artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager

          gh run download \
            "${{ steps.build.outputs.run_id }}" \
            --repo SukiSU-Ultra/SukiSU-Ultra \
            --dir manager

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find and Sign Manager APK
        run: |
          echo "Downloaded files:"
          find manager -type f -print

          # البحث أولاً عن ملفات الـ Gradle release
          mapfile -t APKS < <(
            find manager -type f \
              -path '*/Manager-gradle/*.apk'
          )

          # إذا لم توجد، ابحث عن ملفات الـ Manager الأخرى واستثنِ Spoofed
          if [ "${#APKS[@]}" -lt 1 ]; then
            mapfile -t APKS < <(
              find manager -type f \
                -iname '*.apk' ! -path '*/Spoofed-Manager*'
            )
          fi

          if [ "${#APKS[@]}" -lt 1 ]; then
            echo "ERROR: Expected at least one Manager APK, found 0."
            exit 1
          fi

          RAW_APK="${APKS[0]}"
          echo "Selected APK: $RAW_APK"

          # إنشاء مفتاح توقيع مؤقت وتوقيع الـ APK به لمنع الـ Crash
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # استخدام apksigner للتحقق وتوقيع الـ APK بشهادة v2/v3
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SukiSU-Manager.apk "$RAW_APK"

          echo "Signed APK successfully:"
          ls -lh SukiSU-Manager.apk

      - name: Find latest TouchDirt release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: No published TouchDirt release found."
            exit 1
          fi

          echo "Latest TouchDirt release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload SukiSU Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            SukiSU-Manager.apk \
            --repo "${{ github.repository }}" \
            --clobber

name: Sync SukiSU Manager

on:
  workflow_dispatch: 
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update SukiSU Manager
    runs-on: ubuntu-latest

    steps:
      - name: Get latest SukiSU main commit
        id: sukisu
        run: |
          SHA=$(git ls-remote \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            refs/heads/main | awk '{print $1}')

          echo "SukiSU main: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching manager build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sukisu.outputs.sha }}"

          RUN_ID=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No manager build found for $SHA"
            echo "Falling back to latest successful main build..."

            RUN_ID=$(gh api \
              "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find a successful SukiSU manager build."
            exit 1
          fi

          echo "Using manager build: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Manager artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager

          gh run download \
            "${{ steps.build.outputs.run_id }}" \
            --repo SukiSU-Ultra/SukiSU-Ultra \
            --dir manager

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build and Sign Standalone APK
        run: |
          echo "Finding base APK..."
          
          # اختيار الـ APK الرئيسي
          TARGET_APK=$(find manager -type f -path '*/Manager-gradle/*.apk' | head -n 1)
          if [ -z "$TARGET_APK" ]; then
            TARGET_APK=$(find manager -type f -path '*/Manager/Manager.apk' | head -n 1)
          fi

          echo "Selected Base APK: $TARGET_APK"
          
          # نسخ الملف الأصلي للعمل عليه
          cp "$TARGET_APK" base_working.apk

          # تحديد ملف ksud الخارجي
          KSUD_BIN=$(find manager -type f -path '*/ksud-aarch64-linux-android/ksud' | head -n 1)

          if [ -f "$KSUD_BIN" ]; then
            echo "Embedding ksud correctly into Root Assets and Libs..."
            
            # إنشاء الهيكلية بأسماء المسارات الصحيحة مباشرة
            mkdir -p lib/arm64-v8a
            mkdir -p assets
            
            cp "$KSUD_BIN" lib/arm64-v8a/libksud.so
            cp "$KSUD_BIN" assets/ksud

            # إضافة الملفات إلى جذر الـ APK
            zip -g base_working.apk lib/arm64-v8a/libksud.so
            zip -g base_working.apk assets/ksud
          fi

          # إعداد مفتاح التوقيع
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # المحاذاة والتوقيع النهائي بأداة apksigner
          $BUILD_TOOLS/zipalign -v -p 4 base_working.apk aligned.apk
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SukiSU-Manager.apk aligned.apk

          echo "Standalone SukiSU Manager APK created successfully!"
          ls -lh SukiSU-Manager.apk

      - name: Find latest TouchDirt release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: No published TouchDirt release found."
            exit 1
          fi

          echo "Latest TouchDirt release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload SukiSU Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            SukiSU-Manager.apk \
            --repo "${{ github.repository }}" \
            --clobber

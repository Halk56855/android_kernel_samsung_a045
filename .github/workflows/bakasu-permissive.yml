name: Variant - BakaSU Permissive

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      enable_thinlto:
        required: true
        type: boolean
      enable_oc:
        required: true
        type: boolean
      enable_ccache:
        required: true
        type: boolean
      lock_max_freq:
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VARIANT_SLUG: bakasu-permissive
      VARIANT_LABEL: BakaSU-Permissive
      ROOT_MODE: bakasu
      SELINUX_MODE: permissive
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: a04_defconfig
      OUT_DIR: out
      ANYKERNEL_REPO: https://github.com/Halk56855/AnyKernel3-a04.git
      ANYKERNEL_BRANCH: main

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang curl flex git \
            libelf-dev libssl-dev lld llvm python3 zip

      - name: Setup ccache
        if: inputs.enable_ccache
        uses: henderson/ccache-action@v1
        with:
          key: arckern-${{ env.VARIANT_SLUG }}-${{ inputs.version }}
          max-size: 4G

      - name: Configure kernel options
        run: |
          mkdir -p "${OUT_DIR}"
          make O="${OUT_DIR}" ARCH="${ARCH}" "${DEFCONFIG}"

          # Root & Permissive SELinux configuration
          ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_BAKASU
          ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS
          ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_NOMOUNT
          ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_SECURITY_SELINUX_DEVELOP

          if [ "${{ inputs.enable_thinlto }}" = "true" ]; then
            ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_LTO_CLANG_THIN
          fi

          if [ "${{ inputs.enable_oc }}" = "true" ]; then
            ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_ARCKERN_OC_2500_2000_900
          fi

          if [ "${{ inputs.lock_max_freq }}" = "true" ]; then
            ./scripts/config --file "${OUT_DIR}/.config" --enable CONFIG_ARCKERN_LOCK_MAX_FREQ
          fi

          make O="${OUT_DIR}" ARCH="${ARCH}" olddefconfig

      - name: Compile kernel image
        run: |
          CC_PREFIX=""
          if [ "${{ inputs.enable_ccache }}" = "true" ]; then
            CC_PREFIX="ccache "
          fi

          make -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            CC="${CC_PREFIX}clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package AnyKernel3 flashable ZIP
        run: |
          git clone --depth=1 -b "${ANYKERNEL_BRANCH}" "${ANYKERNEL_REPO}" anykernel
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" anykernel/Image.gz-dtb 2>/dev/null || \
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" anykernel/Image.gz

          ZIP_NAME="ArcKern+-${{ inputs.version }}-a04-${VARIANT_SLUG}.zip"
          cd anykernel
          zip -r9 "../${ZIP_NAME}" . -x ".git*" "README.md"
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcKern+-${{ inputs.version }}-${{ env.VARIANT_SLUG }}
          path: ${{ env.ZIP_NAME }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ArcKern+ ${{ inputs.version }}
          body_path: .github/release-notes/${{ inputs.version }}.md
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: false

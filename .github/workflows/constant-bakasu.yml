
name: TouchDirt - Constant BakaSU Builds

on:
  schedule:
    # 00:00 Asia/Jakarta (UTC+7)
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: constant-bakasu-v1.0.3
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sha: ${{ steps.compare.outputs.sha }}
      nomount_sha: ${{ steps.compare.outputs.nomount_sha }}

    steps:
      - name: Get latest BakaSU main commit
        id: bakasu
        run: |
          SHA=$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main | awk '{print $1}')

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Could not resolve BakaSU main."
            exit 1
          fi

          echo "Latest BakaSU: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Get latest NoMount master commit
        id: nomount
        run: |
          SHA=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/master | awk '{print $1}')

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Could not resolve NoMount master."
            exit 1
          fi

          echo "Latest NoMount: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compare with last published revisions
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_SHA: ${{ steps.bakasu.outputs.sha }}
          LATEST_NOMOUNT_SHA: ${{ steps.nomount.outputs.sha }}
        run: |
          mkdir -p previous

          LAST_SHA=""
          LAST_NOMOUNT_SHA=""

          if gh release download v1.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern bakasu-commit.txt \
            --dir previous; then
            LAST_SHA=$(tr -d '[:space:]' < previous/bakasu-commit.txt)
          fi

          if gh release download v1.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern nomount-commit.txt \
            --dir previous; then
            LAST_NOMOUNT_SHA=$(tr -d '[:space:]' < previous/nomount-commit.txt)
          fi

          echo "BakaSU:"
          echo "  Previous: ${LAST_SHA:-none}"
          echo "  Current:  $LATEST_SHA"

          echo "NoMount:"
          echo "  Previous: ${LAST_NOMOUNT_SHA:-none}"
          echo "  Current:  $LATEST_NOMOUNT_SHA"

          if [ "$LATEST_SHA" = "$LAST_SHA" ] && \
             [ "$LATEST_NOMOUNT_SHA" = "$LAST_NOMOUNT_SHA" ]; then
            echo "Neither upstream has changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "An upstream dependency has changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "nomount_sha=$LATEST_NOMOUNT_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build both variants
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    uses: ./.github/workflows/build-bakasu.yml
    with:
      version: v1.0.3
      bakasu_sha: ${{ needs.check-upstream.outputs.sha }}
      nomount_sha: ${{ needs.check-upstream.outputs.nomount_sha }}


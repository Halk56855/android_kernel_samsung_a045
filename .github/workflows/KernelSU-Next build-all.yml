name: KernelSU-Next - Build All

on:
  workflow_dispatch:
    inputs:
      version:
        description: "KernelSU-Next version"
        required: true
        type: string
        default: "v3.0.1"

permissions:
  contents: write
  actions: read

jobs:
  ksu-next-enforcing:
    name: KernelSU-Next - Enforcing
    uses: ./.github/workflows/KernelSU-Next-enforcing.yml
    with:
      version: ${{ inputs.version }}

  ksu-next-permissive:
    name: KernelSU-Next - Permissive
    uses: ./.github/workflows/KernelSU-Next-permissive.yml
    with:
      version: ${{ inputs.version }}

  vanilla-enforcing:
    name: Vanilla - Enforcing
    uses: ./.github/workflows/vanilla-enforcing.yml
    with:
      version: ${{ inputs.version }}

  vanilla-permissive:
    name: Vanilla - Permissive
    uses: ./.github/workflows/vanilla-permissive.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Publish Release
    needs:
      - ksu-next-enforcing
      - ksu-next-permissive
      - vanilla-enforcing
      - vanilla-permissive

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets

      - name: Consolidate assets
        id: prepare_assets
        run: |
          mkdir -p dist
          find release-assets -type f -name "*.zip" -exec cp {} dist/ \;

          FILE=$(find dist -type f -name '*.zip' | head -n 1)
          VERSION=$(basename "$FILE" | sed -n 's/^KernelSU-Next-[^-]*-\(v[0-9.]*\)-.*/\1/p')

          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.prepare_assets.outputs.version }}"

          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true

          NOTES_FILE=".github/release-notes/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$VERSION" dist/*.zip --title "KernelSU-Next $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" dist/*.zip --title "KernelSU-Next $VERSION" --generate-notes
          fi

  ksu-next-manager:
    name: KernelSU-Next Manager
    needs:
      - release
    uses: ./.github/workflows/update-KernelSU-Next.yml

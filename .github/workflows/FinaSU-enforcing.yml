name: Build FinaSU Kernel and Pack AnyKernel3 for Galaxy A04

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Kernel Source
          uses: actions/checkout@v4

        - name: Install Dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 make clang

        - name: Clone and Inject FinaSU
          run: |
            # استنساخ مستودع FinaSU لجلب ملفات النواة
            git clone https://github.com/Halk56855/FinaSU-galaxy-a04.git temp_finasu
            
            # نسخ ملفات FinaSU إلى مجلد السائقين داخل النواة
            mkdir -p drivers/kernelsu
            cp -rf temp_finasu/kernel/* drivers/kernelsu/
            
            # ربط الكود آلياً بملفات Kconfig و Makefile الخاصة بالنواة
            if ! grep -q "kernelsu" drivers/Kconfig; then
              echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            fi
            if ! grep -q "kernelsu" drivers/Makefile; then
              echo 'obj-y += kernelsu/' >> drivers/Makefile
            fi

        - name: Download GCC Toolchain
          run: |
            mkdir -p toolchain/gcc
            cd toolchain/gcc
            wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
              https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
            wget -q --show-progress \
              https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
            tar -xf gcc.tar.xz -C ./

        - name: Setup Toolchain (AOSPA Clang)
          run: |
            git clone --depth=1 https://github.com/AOSPA/android_prebuilts_clang_host_linux-x86.git clang-aosp

        - name: Build Kernel
          run: |
            export ARCH=arm64
            export SUBARCH=arm64
            
            # تحديد مسارات أدوات التجميع
            GCC_DIR="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"
            CLANG_DIR="$(pwd)/clang-aosp/clang-r416183b/bin"
            
            export PATH="$GCC_DIR:$CLANG_DIR:$PATH"
            
            # استخدام اسم ملف الإعدادات الصحيح والموجود في المستودع (a04_defconfig)
            make O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-none-linux-gnu- a04_defconfig
            
            # بدء عملية تجميع النواة
            make O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-none-linux-gnu- -j$(nproc)

        - name: Package Kernel with AnyKernel3
          run: |
            # استنساخ مستودع AnyKernel3
            git clone https://github.com/Halk56855/AnyKernel3-a04.git anykernel
            
            # نسخ ملف النواة الناتج إلى مجلد AnyKernel3
            cp out/arch/arm64/boot/Image.gz anykernel/
            
            # ضغط المجلد لإنتاج ملف ZIP النهائي القابل للتفليش
            cd anykernel
            zip -r9 ../FinaSU-Galaxy-A04-Flashable.zip *
            cd ..

        - name: Upload Flashable ZIP
          uses: actions/upload-artifact@v4
          with:
            name: FinaSU-Galaxy-A04-Flashable-ZIP
            path: FinaSU-Galaxy-A04-Flashable.zip

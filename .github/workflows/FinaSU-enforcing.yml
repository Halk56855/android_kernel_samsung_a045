.name: Autonomous AI Kernel Build & Fixer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # للسماح للذكاء الاصطناعي بعمل Commit والتعديل التلقائي

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git wget ccache zip python3 python3-pip
          pip3 install openai

      - name: Setup Android Clang & GCC Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz -O clang.tar.gz
          mkdir clang && tar -xf clang.tar.gz -C clang
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz -O gcc.tar.gz
          mkdir gcc && tar -xf gcc.tar.gz -C gcc

      - name: Integrate FinaSU Source
        run: |
          if [ ! -d "finasu-src" ]; then
            git clone https://github.com/LyraVoid/FinaSU.git finasu-src[span_0](start_span)[span_0](end_span)
          fi

      - name: Attempt Kernel Compilation
        id: compile
        continue-on-error: true
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          
          make O=out a04_defconfig
          make -j$(nproc) O=out 2>&1 | tee build_error.log

      - name: AI Auto-Fix (Runs Automatically on Failure without Prompts)
        if: steps.compile.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import openai

          api_key = os.getenv("OPENAI_API_KEY")
          if not api_key:
              print("❌ لم يتم العثور على OPENAI_API_KEY. يرجى إضافته في Repository Secrets.")
              exit(1)

          client = openai.OpenAI(api_key=api_key)

          # قراءة سجل الأخطاء
          with open("build_error.log", "r") as f:
              logs = f.read()

          # استخراج اسم الملف المصدر المسبب للخطأ
          matches = re.findall(r'([a-zA-Z0-9_\-\/]+\.[c|h]):(\d+):\d+: error:', logs)
          
          if matches:
              file_path, line_num = matches[0]
              print(f"⚡ اكتشف الذكاء الاصطناعي خطأ في الملف: {file_path} عند السطر: {line_num}")
              
              if os.path.exists(file_path):
                  with open(file_path, "r") as f:
                      code_content = f.read()

                  prompt = f"""
                  You are an expert Linux Kernel 4.19 developer fixing a C build error for Samsung A04 / FinaSU.
                  Error log:
                  {logs[-2000:]}

                  File path: {file_path}
                  Code context:
                  {code_content[:4000]}

                  Please fix the error and return ONLY the completely corrected code content for {file_path}. No explanation, no markdown.
                  """

                  response = client.chat.completions.create(
                      model="gpt-4o",
                      messages=[{"role": "user", "content": prompt}]
                  )

                  fixed_code = response.choices[0].message.content.strip()

                  # إزالة وسم الكود إن وجد
                  if fixed_code.startswith("```"):
                      fixed_code = "\n".join(fixed_code.split("\n")[1:-1])

                  with open(file_path, "w") as f:
                      f.write(fixed_code)

                  print(f"✅ تم إصلاح الملف {file_path} تلقائياً بواسطة الذكاء الاصطناعي!")
          else:
              print("⚠️ لم يتم تحديد الملف المسبب للخطأ بدقة في سجلات C.")
          EOF

      - name: Auto-Commit AI Fixes
        if: steps.compile.outcome == 'failure'
        run: |
          git config user.name "AI-Auto-Fixer[bot]"
          git config user.email "ai-bot@users.noreply.github.com"
          git add .
          git commit -m "chore(ai): auto-fixed build error in kernel source [skip ci]" || true
          git push origin main
          echo "🔄 تم الحفظ والتعديل تلقائياً، وسيتم إعادة المحاولة في التشغيل القادم."
          exit 1 # لإخطار النظام بإعادة التشغيل بعد التعديل

      - name: Package Output (On Success)
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p output
          cp out/arch/arm64/boot/Image.gz-dtb output/ || cp out/arch/arm64/boot/Image output/
          cd output && zip -r FinaSU_A04_Kernel_4.19.zip *

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outcome == 'success'
        with:
          tag_name: finasu-kernel-v${{ github.run_number }}
          name: Auto-Fixed FinaSU Kernel - Galaxy A04 (#${{ github.run_number }})
          files: output/FinaSU_A04_Kernel_4.19.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

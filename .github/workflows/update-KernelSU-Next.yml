name: Sync KernelSU-Next Manager

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update KernelSU-Next Manager
    runs-on: ubuntu-latest

    steps:
      - name: Download latest APK from KernelSU-Next Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager

          # تنزيل ملفات الـ APK المرفقة في أحدث Release رسمي
          gh release download \
            --repo KernelSU-Next/KernelSU-Next \
            --pattern "*.apk" \
            --dir manager

      - name: Find and Rename Manager APK
        run: |
          echo "Downloaded release files:"
          find manager -type f -print

          # البحث عن ملفات APK وتجنب النسخة المضللة (spoofed) إن وجدت
          mapfile -t APKS < <(find manager -type f -iname '*.apk' ! -iname '*spoofed*')

          if [ "${#APKS[@]}" -ge 1 ]; then
            cp "${APKS[0]}" KernelSU-Next-Manager.apk
          else
            # fallback في حال لم يجد سوى ملف واحد
            mapfile -t ALL_APKS < <(find manager -type f -iname '*.apk')
            if [ "${#ALL_APKS[@]}" -ge 1 ]; then
              cp "${ALL_APKS[0]}" KernelSU-Next-Manager.apk
            else
              echo "::error::No APK file found in the latest release."
              exit 1
            fi
          fi

          echo "Selected APK:"
          ls -lh KernelSU-Next-Manager.apk

      - name: Find latest release in target repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "::error::No published release found in target repository."
            exit 1
          fi

          echo "Target release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload Manager to Target Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            KernelSU-Next-Manager.apk \
            --repo "${{ github.repository }}" \
            --clobber

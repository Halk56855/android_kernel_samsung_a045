name: Sync KernelSU-Next Legacy Manager

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update KernelSU-Next Legacy Manager
    runs-on: ubuntu-latest

    steps:
      - name: Get latest Legacy release tag and commit
        id: ksud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # جلب أحدث Tag يحتوي على الكلمة legacy
          TAG=$(gh release list \
            --repo KernelSU-Next/KernelSU-Next \
            --limit 20 \
            --json tagName \
            --jq '.[] | select(.tagName | contains("legacy")) | .tagName' | head -n 1)

          if [ -z "$TAG" ]; then
            echo "::error::Could not find any legacy tag in KernelSU-Next repository."
            exit 1
          fi

          echo "Found latest legacy tag: $TAG"

          # جلب الـ Commit SHA المرتبط بـ Tag الـ Legacy
          SHA=$(gh api "repos/KernelSU-Next/KernelSU-Next/commits/$TAG" --jq '.sha')

          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve commit SHA for tag $TAG."
            exit 1
          fi

          echo "KernelSU-Next legacy commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Find matching manager build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.ksud.outputs.sha }}"

          # البحث عن بناء ناجح مخصص لـ SHA الخاص بـ Legacy
          RUN_ID=$(gh api "repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No direct manager build found for $SHA. Searching latest successful build..."
            RUN_ID=$(gh api "repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find a successful KernelSU-Next manager build."
            exit 1
          fi

          echo "Using manager build: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Manager Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo KernelSU-Next/KernelSU-Next \
            --name manager \
            --dir manager

      - name: Find Manager APK
        run: |
          echo "Downloaded files:"
          find manager -type f -print

          mapfile -t APKS < <(find manager -type f -iname '*.apk')

          if [ "${#APKS[@]}" -ge 1 ]; then
            cp "${APKS[0]}" KernelSU-Next-Manager-Legacy.apk
          else
            echo "::error::No APK found in the manager artifact."
            exit 1
          fi

          echo "Selected legacy manager APK:"
          ls -lh KernelSU-Next-Manager-Legacy.apk

      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "::error::No published release found in target repository."
            exit 1
          fi

          echo "Target release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload KernelSU-Next Legacy Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            KernelSU-Next-Manager-Legacy.apk \
            --repo "${{ github.repository }}" \
            --clobber

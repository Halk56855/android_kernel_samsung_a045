name: Sync KernelSU-Next Manager

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  sync-manager:
    name: Update KernelSU-Next Manager
    runs-on: ubuntu-latest

    steps:
      - name: Get latest KernelSU-Next main commit
        id: ksud
        run: |
          SHA=$(git ls-remote https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/next | awk '{print $1}')
          if [ -z "$SHA" ]; then
            # تجربة فرع main في حال عدم وجود فرع next
            SHA=$(git ls-remote https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/main | awk '{print $1}')
          fi

          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve commit SHA from KernelSU-Next repository."
            exit 1
          fi

          echo "KernelSU-Next commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching manager build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.ksud.outputs.sha }}"

          RUN_ID=$(gh api "repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No manager build found for $SHA. Falling back to latest successful build..."
            RUN_ID=$(gh api "repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find a successful KernelSU-Next manager build."
            exit 1
          fi

          echo "Using manager build: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Manager-release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manager
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo KernelSU-Next/KernelSU-Next \
            --name Manager-release \
            --dir manager

      - name: Find ARM64 Manager APK
        run: |
          echo "Downloaded files:"
          find manager -type f -print

          mapfile -t APKS < <(find manager -type f -iname '*arm64*.apk')

          if [ "${#APKS[@]}" -ne 0 ]; then
            cp "${APKS[0]}" KernelSU-Next-Manager.apk
          else
            # في حال عدم التمييز بـ arm64 واستخدام apk عادي
            mapfile -t ALL_APKS < <(find manager -type f -iname '*.apk')
            if [ "${#ALL_APKS[@]}" -ge 1 ]; then
              cp "${ALL_APKS[0]}" KernelSU-Next-Manager.apk
            else
              echo "::error::No APK found in the artifacts."
              exit 1
            fi
          fi

          echo "Selected manager APK:"
          ls -lh KernelSU-Next-Manager.apk

      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "::error::No published release found in target repository."
            exit 1
          fi

          echo "Target release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload KernelSU-Next Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.release.outputs.tag }}" \
            KernelSU-Next-Manager.apk \
            --repo "${{ github.repository }}" \
            --clobber

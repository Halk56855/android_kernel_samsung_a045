name: ArcKern+ - Build BakaSU (v1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArcKern+ version"
        required: true
        type: string
        default: "v1.0"
      bakasu_sha:
        description: "Exact BakaSU commit to build (leave empty for latest main)"
        required: false
        type: string
        default: ""
      nomount_sha:
        description: "Exact NoMount commit to integrate (leave empty for latest master)"
        required: false
        type: string
        default: ""
      enable_lto:
        description: "Enable ThinLTO (Better Performance & Efficiency)"
        required: false
        type: boolean
        default: true
      enable_oc:
        description: "Enable Balanced Overclock (CPU 2500/2000 MHz, GPU 900 MHz - Cool & Smooth)"
        required: false
        type: boolean
        default: true
      lock_max_freq:
        description: "Force Lock Max CPU/GPU Frequency (Higher Heat)"
        required: false
        type: boolean
        default: false
      use_ccache:
        description: "Enable ccache to Speed Up Rebuilds"
        required: false
        type: boolean
        default: true
      clean_build:
        description: "Clean 'out' Directory Before Building"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "v1.0"
      bakasu_sha:
        required: false
        type: string
        default: ""
      nomount_sha:
        required: false
        type: string
        default: ""
      enable_lto:
        required: false
        type: boolean
        default: true
      enable_oc:
        required: false
        type: boolean
        default: true
      lock_max_freq:
        required: false
        type: boolean
        default: false
      use_ccache:
        required: false
        type: boolean
        default: true
      clean_build:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  resolve-upstreams:
    name: Resolve upstream revisions
    runs-on: ubuntu-latest
    outputs:
      bakasu_sha: ${{ steps.resolve.outputs.bakasu_sha }}
      nomount_sha: ${{ steps.resolve.outputs.nomount_sha }}

    steps:
      - name: Resolve exact upstream commits
        id: resolve
        env:
          REQUESTED_BAKASU: ${{ inputs.bakasu_sha }}
          REQUESTED_NOMOUNT: ${{ inputs.nomount_sha }}
        run: |
          BAKASU="$REQUESTED_BAKASU"
          NOMOUNT="$REQUESTED_NOMOUNT"

          if [ -z "$BAKASU" ]; then
            BAKASU=$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main | awk '{print $1}')
          fi

          if [ -z "$NOMOUNT" ]; then
            NOMOUNT=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/master | awk '{print $1}')
          fi

          if ! [[ "$BAKASU" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid BakaSU SHA: $BAKASU"
            exit 1
          fi

          if ! [[ "$NOMOUNT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid NoMount SHA: $NOMOUNT"
            exit 1
          fi

          echo "BakaSU: $BAKASU"
          echo "NoMount: $NOMOUNT"

          echo "bakasu_sha=$BAKASU" >> "$GITHUB_OUTPUT"
          echo "nomount_sha=$NOMOUNT" >> "$GITHUB_OUTPUT"

  bakasu-enforcing:
    name: ArcKern+ BakaSU - Enforcing
    needs: resolve-upstreams
    uses: ./.github/workflows/bakasu-enforcing.yml
    with:
      version: ${{ inputs.version }}
      bakasu_sha: ${{ needs.resolve-upstreams.outputs.bakasu_sha }}
      nomount_sha: ${{ needs.resolve-upstreams.outputs.nomount_sha }}
      enable_lto: ${{ inputs.enable_lto }}
      enable_oc: ${{ inputs.enable_oc }}
      lock_max_freq: ${{ inputs.lock_max_freq }}
      use_ccache: ${{ inputs.use_ccache }}
      clean_build: ${{ inputs.clean_build }}

  bakasu-permissive:
    name: ArcKern+ BakaSU - Permissive
    needs: resolve-upstreams
    uses: ./.github/workflows/bakasu-permissive.yml
    with:
      version: ${{ inputs.version }}
      bakasu_sha: ${{ needs.resolve-upstreams.outputs.bakasu_sha }}
      nomount_sha: ${{ needs.resolve-upstreams.outputs.nomount_sha }}
      enable_lto: ${{ inputs.enable_lto }}
      enable_oc: ${{ inputs.enable_oc }}
      lock_max_freq: ${{ inputs.lock_max_freq }}
      use_ccache: ${{ inputs.use_ccache }}
      clean_build: ${{ inputs.clean_build }}

  vanilla-enforcing:
    name: ArcKern+ Vanilla - Enforcing
    needs: resolve-upstreams
    uses: ./.github/workflows/vanilla-enforcing.yml
    with:
      version: ${{ inputs.version }}
      enable_lto: ${{ inputs.enable_lto }}
      enable_oc: ${{ inputs.enable_oc }}
      lock_max_freq: ${{ inputs.lock_max_freq }}
      use_ccache: ${{ inputs.use_ccache }}
      clean_build: ${{ inputs.clean_build }}

  vanilla-permissive:
    name: ArcKern+ Vanilla - Permissive
    needs: resolve-upstreams
    uses: ./.github/workflows/vanilla-permissive.yml
    with:
      version: ${{ inputs.version }}
      enable_lto: ${{ inputs.enable_lto }}
      enable_oc: ${{ inputs.enable_oc }}
      lock_max_freq: ${{ inputs.lock_max_freq }}
      use_ccache: ${{ inputs.use_ccache }}
      clean_build: ${{ inputs.clean_build }}

  release:
    name: Publish Release Assets
    needs:
      - resolve-upstreams
      - bakasu-enforcing
      - bakasu-permissive
      - vanilla-enforcing
      - vanilla-permissive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets

      - name: Validate and prepare release metadata
        env:
          VERSION: ${{ inputs.version }}
          BAKASU_SHA: ${{ needs.resolve-upstreams.outputs.bakasu_sha }}
          NOMOUNT_SHA: ${{ needs.resolve-upstreams.outputs.nomount_sha }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "ERROR: Release version is empty."
            exit 1
          fi

          shopt -s nullglob
          ZIPS=(release-assets/*/*.zip)

          if [ "${#ZIPS[@]}" -lt 2 ]; then
            echo "ERROR: Expected kernel ZIPs, found ${#ZIPS[@]}."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          printf '%s\n' "$BAKASU_SHA" > release-assets/bakasu-commit.txt
          printf '%s\n' "$NOMOUNT_SHA" > release-assets/nomount-commit.txt

          echo "Prepared release for $VERSION"
          echo "BakaSU: $BAKASU_SHA"
          echo "NoMount: $NOMOUNT_SHA"

      - name: Update the fixed release without moving its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f ".github/release-notes/$VERSION.md" ]; then
              gh release create "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --target main \
                --title "ArcKern+ $VERSION" \
                --notes-file ".github/release-notes/$VERSION.md"
            else
              gh release create "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --target main \
                --title "ArcKern+ $VERSION" \
                --notes "ArcKern+ $VERSION build"
            fi
          fi

          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.assets[].name')

          while IFS= read -r ASSET; do
            [ -z "$ASSET" ] && continue

            case "$ASSET" in
              ArcKern+-*.zip|TouchDirt-*.zip|bakasu-commit.txt|nomount-commit.txt)
                gh release delete-asset "$VERSION" "$ASSET" \
                  --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done <<< "$ASSETS"

          shopt -s nullglob
          ZIPS=(release-assets/*/*.zip)

          gh release upload "$VERSION" "${ZIPS[@]}" \
            --repo "$GITHUB_REPOSITORY"

          # Upload revision markers last.
          gh release upload "$VERSION" \
            release-assets/bakasu-commit.txt \
            release-assets/nomount-commit.txt \
            --repo "$GITHUB_REPOSITORY"

  bakasu-manager:
    name: BakaSU Manager
    needs:
      - release
      - resolve-upstreams
    uses: ./.github/workflows/update-bakasu-manager.yml
    with:
      bakasu_sha: ${{ needs.resolve-upstreams.outputs.bakasu_sha }}

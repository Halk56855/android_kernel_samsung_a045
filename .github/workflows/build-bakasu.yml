name: ArcKern+ - Build BakaSU

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  resolve-upstreams:
    name: Resolve latest upstream revisions & release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      bakasu_sha: ${{ steps.resolve.outputs.bakasu_sha }}
      nomount_sha: ${{ steps.resolve.outputs.nomount_sha }}

    steps:
      - name: Resolve latest release tag & upstream commits
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git ls-remote --tags --sort=-v:refname "https://github.com/$GITHUB_REPOSITORY.git" | head -n1 | sed 's/.*refs\/tags\///;s/\^{}//')
          fi
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0"
          fi

          BAKASU=$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main | awk '{print $1}')
          NOMOUNT=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/master | awk '{print $1}')

          if ! [[ "$BAKASU" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid BakaSU SHA: $BAKASU"
            exit 1
          fi

          if ! [[ "$NOMOUNT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid NoMount SHA: $NOMOUNT"
            exit 1
          fi

          echo "Latest Release Tag: $LATEST_TAG"
          echo "BakaSU: $BAKASU"
          echo "NoMount: $NOMOUNT"

          echo "version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "bakasu_sha=$BAKASU" >> "$GITHUB_OUTPUT"
          echo "nomount_sha=$NOMOUNT" >> "$GITHUB_OUTPUT"

  bakasu-enforcing:
    name: BakaSU - Enforcing
    needs: resolve-upstreams
    uses: ./.github/workflows/bakasu-enforcing.yml
    with:
      version: ${{ needs.resolve-upstreams.outputs.version }}
      enable_thinlto: true
      enable_oc: true
      enable_ccache: true
      lock_max_freq: false

  bakasu-permissive:
    name: BakaSU - Permissive
    needs: resolve-upstreams
    uses: ./.github/workflows/bakasu-permissive.yml
    with:
      version: ${{ needs.resolve-upstreams.outputs.version }}
      enable_thinlto: true
      enable_oc: true
      enable_ccache: true
      lock_max_freq: false

  release:
    name: Publish Release Assets
    needs:
      - resolve-upstreams
      - bakasu-enforcing
      - bakasu-permissive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate and prepare release metadata
        env:
          VERSION: ${{ needs.resolve-upstreams.outputs.version }}
          BAKASU_SHA: ${{ needs.resolve-upstreams.outputs.bakasu_sha }}
          NOMOUNT_SHA: ${{ needs.resolve-upstreams.outputs.nomount_sha }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "ERROR: Release version is empty."
            exit 1
          fi

          shopt -s nullglob
          ZIPS=(release-assets/*/*.zip)

          if [ "${#ZIPS[@]}" -lt 1 ]; then
            echo "ERROR: Expected kernel ZIP artifacts, found 0."
            exit 1
          fi

          printf '%s\n' "$BAKASU_SHA" > release-assets/bakasu-commit.txt
          printf '%s\n' "$NOMOUNT_SHA" > release-assets/nomount-commit.txt

          echo "Prepared release for $VERSION"
          echo "BakaSU: $BAKASU_SHA"
          echo "NoMount: $NOMOUNT_SHA"

      - name: Update release without moving its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-upstreams.outputs.version }}
        run: |
          NOTES_ARG=()
          if [ -f ".github/release-notes/${VERSION}.md" ]; then
            NOTES_ARG=(--notes-file ".github/release-notes/${VERSION}.md")
          else
            NOTES_ARG=(--notes "ArcKern+ ${VERSION} automated build for Samsung Galaxy A04 (SM-A045F / MT6765).")
          fi

          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "ArcKern+ $VERSION" \
              "${NOTES_ARG[@]}"
          fi

          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.assets[].name')

          while IFS= read -r ASSET; do
            [ -z "$ASSET" ] && continue

            case "$ASSET" in
              ArcKern+-*.zip|bakasu-commit.txt|nomount-commit.txt)
                gh release delete-asset "$VERSION" "$ASSET" \
                  --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done <<< "$ASSETS"

          shopt -s nullglob
          ZIPS=(release-assets/*/*.zip)

          gh release upload "$VERSION" "${ZIPS[@]}" \
            --repo "$GITHUB_REPOSITORY"

          gh release upload "$VERSION" \
            release-assets/bakasu-commit.txt \
            release-assets/nomount-commit.txt \
            --repo "$GITHUB_REPOSITORY"

  bakasu-manager:
    name: BakaSU Manager
    needs:
      - release
      - resolve-upstreams
    uses: ./.github/workflows/update-bakasu-manager.yml

name: ArcKern+ - Build BakaSU (v1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag / version"
        required: true
        default: "v1.0"
        type: string
      manager_version:
        description: "BakaSU Manager version or tag"
        required: true
        default: "latest"
        type: string
      enable_thinlto:
        description: "Enable Clang ThinLTO"
        required: true
        default: true
        type: boolean
      enable_oc:
        description: "Enable balanced OC (CPU 2500/2000 MHz, GPU 900 MHz)"
        required: true
        default: true
        type: boolean
      enable_ccache:
        description: "Enable ccache for faster builds"
        required: true
        default: true
        type: boolean
      lock_max_freq:
        description: "Lock max CPU/GPU frequencies (may increase heat)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update_bakasu_manager:
    name: Update BakaSU Manager
    uses: ./.github/workflows/update-bakasu-manager.yml
    with:
      manager_version: ${{ inputs.manager_version }}
      release_tag: ${{ inputs.version }}

  build_bakasu_enforcing:
    name: BakaSU - Enforcing
    needs: update_bakasu_manager
    uses: ./.github/workflows/bakasu-enforcing.yml
    with:
      version: ${{ inputs.version }}
      enable_thinlto: ${{ inputs.enable_thinlto }}
      enable_oc: ${{ inputs.enable_oc }}
      enable_ccache: ${{ inputs.enable_ccache }}
      lock_max_freq: ${{ inputs.lock_max_freq }}

  build_bakasu_permissive:
    name: BakaSU - Permissive
    needs: update_bakasu_manager
    uses: ./.github/workflows/bakasu-permissive.yml
    with:
      version: ${{ inputs.version }}
      enable_thinlto: ${{ inputs.enable_thinlto }}
      enable_oc: ${{ inputs.enable_oc }}
      enable_ccache: ${{ inputs.enable_ccache }}
      lock_max_freq: ${{ inputs.lock_max_freq }}

  build_vanilla_enforcing:
    name: Vanilla - Enforcing
    needs: update_bakasu_manager
    uses: ./.github/workflows/vanilla-enforcing.yml
    with:
      version: ${{ inputs.version }}
      enable_thinlto: ${{ inputs.enable_thinlto }}
      enable_oc: ${{ inputs.enable_oc }}
      enable_ccache: ${{ inputs.enable_ccache }}
      lock_max_freq: ${{ inputs.lock_max_freq }}

  build_vanilla_permissive:
    name: Vanilla - Permissive
    needs: update_bakasu_manager
    uses: ./.github/workflows/vanilla-permissive.yml
    with:
      version: ${{ inputs.version }}
      enable_thinlto: ${{ inputs.enable_thinlto }}
      enable_oc: ${{ inputs.enable_oc }}
      enable_ccache: ${{ inputs.enable_ccache }}
      lock_max_freq: ${{ inputs.lock_max_freq }}

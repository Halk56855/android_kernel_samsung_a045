name: Build TouchDirt Kernel, FinaSU, SUSFS, Enforcing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version Tag (e.g., v1.0)'
        required: true
        default: 'BETA'
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Integrating FinaSU & SUSFS (Keeping .git & Patching Kernel 4.19)
      run: |
        echo "[-] Cloning FinaSU repo (preserving .git)..."
        git clone -b master https://github.com/LyraVoid/FinaSU.git KernelSU

        echo "[-] Running FinaSU setup script..."
        chmod +x ./KernelSU/kernel/setup.sh
        ./KernelSU/kernel/setup.sh

        echo "[-] Patching FinaSU for older kernel 4.19 (Fixing allowlist.c, app_profile.c, rules.c, sepolicy.c, sulog/event.c, MODULE_IMPORT_NS, static_assert, pgtable.h, su_mount_ns.c & stubbing unsupported files)..."
        if [ -f "./drivers/kernelsu/core/init.c" ]; then
          sed -i '/MODULE_IMPORT_NS/d' ./drivers/kernelsu/core/init.c
        elif [ -f "./KernelSU/kernel/core/init.c" ]; then
          sed -i '/MODULE_IMPORT_NS/d' ./KernelSU/kernel/core/init.c
        fi

        if [ -f "./drivers/kernelsu/feature/netisolate.c" ]; then
          sed -i '/static_assert/d' ./drivers/kernelsu/feature/netisolate.c
        elif [ -f "./KernelSU/kernel/feature/netisolate.c" ]; then
          sed -i '/static_assert/d' ./KernelSU/kernel/feature/netisolate.c
        fi

        if [ -f "./drivers/kernelsu/feature/uts_view.c" ]; then
          sed -i '/static_assert/d' ./drivers/kernelsu/feature/uts_view.c
        elif [ -f "./KernelSU/kernel/feature/uts_view.c" ]; then
          sed -i '/static_assert/d' ./KernelSU/kernel/feature/uts_view.c
        fi

        # Fix pgtable.h for kernel 4.19 in sucompat.c
        SUCOMPAT_PATH=""
        if [ -f "./drivers/kernelsu/feature/sucompat.c" ]; then
          SUCOMPAT_PATH="./drivers/kernelsu/feature/sucompat.c"
        elif [ -f "./KernelSU/kernel/feature/sucompat.c" ]; then
          SUCOMPAT_PATH="./KernelSU/kernel/feature/sucompat.c"
        fi

        if [ -n "$SUCOMPAT_PATH" ]; then
          echo "[-] Patching pgtable.h in $SUCOMPAT_PATH for kernel 4.19..."
          sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$SUCOMPAT_PATH"
        fi

        # Fix uapi/linux/mount.h header inclusion for kernel 4.19 in su_mount_ns.c
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/infra/su_mount_ns.c", "./KernelSU/kernel/infra/su_mount_ns.c"]:
            if os.path.exists(path):
                with open(path, "r") as f:
                    content = f.read()
                content = content.replace("#include <uapi/linux/mount.h>", "#include <linux/mount.h>")
                with open(path, "w") as f:
                    f.write(content)
                print("Patched su_mount_ns.c at:", path)
        '

        # Patch app_profile.c for kernel 4.19 (fixing missing filter_count)
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/policy/app_profile.c", "./KernelSU/kernel/policy/app_profile.c"]:
            if os.path.exists(path):
                with open(path, "r") as f:
                    content = f.read()
                target = "atomic_set(&current->seccomp.filter_count, 0);"
                replacement = """
        #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)
                atomic_set(&current->seccomp.filter_count, 0);
        #else
                if (current->seccomp.mode != SECCOMP_MODE_DISABLED) {
                    current->seccomp.mode = SECCOMP_MODE_DISABLED;
                    current->seccomp.filter = NULL;
                }
        #endif
                """
                if target in content:
                    content = content.replace(target, replacement)
                    with open(path, "w") as f:
                        f.write(content)
                    print("Patched app_profile.c at:", path)
        '

        # Safely stub out rules.c for kernel 4.19 (since selinux_state.policy does not exist on 4.19)
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/selinux/rules.c", "./KernelSU/kernel/selinux/rules.c"]:
            if os.path.exists(path):
                with open(path, "w") as f:
                    f.write("""
                    #include <linux/version.h>
                    #include <linux/types.h>
                    
                    int ksu_selinux_init(void) { return 0; }
                    void ksu_selinux_exit(void) {}
                    int ksu_apply_custom_con(void) { return 0; }
                    """)
                print("Safely stubbed rules.c at:", path)
        '

        # Safely stub out sepolicy.c for kernel 4.19 (fixing SELinux structural mismatch)
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/selinux/sepolicy.c", "./KernelSU/kernel/selinux/sepolicy.c"]:
            if os.path.exists(path):
                with open(path, "w") as f:
                    f.write("""
                    #include <linux/version.h>
                    #include <linux/types.h>
                    
                    int ksu_selinux_allow(const char *sall, const char *tclass, const char *perm) { return 0; }
                    """)
                print("Safely stubbed sepolicy.c at:", path)
        '

        # Patch sulog/event.c for kernel 4.19 (fixing missing linux/minmax.h)
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/sulog/event.c", "./KernelSU/kernel/sulog/event.c"]:
            if os.path.exists(path):
                with open(path, "r") as f:
                    content = f.read()
                content = content.replace("#include <linux/minmax.h>", "#include <linux/kernel.h>")
                with open(path, "w") as f:
                    f.write(content)
                print("Patched sulog/event.c at:", path)
        '

        # Patch allowlist.c for kernel 4.19 (defining fallthrough and TWA_RESUME)
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/policy/allowlist.c", "./KernelSU/kernel/policy/allowlist.c"]:
            if os.path.exists(path):
                with open(path, "r") as f:
                    content = f.read()
                fix_headers = """
                #ifndef fallthrough
                #define fallthrough
                #endif
                #ifndef TWA_RESUME
                #define TWA_RESUME 1
                #endif
                """
                content = fix_headers + content
                with open(path, "w") as f:
                    f.write(content)
                print("Patched allowlist.c at:", path)
        '

        # Safely stub out file_wrapper.c for kernel 4.19
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/infra/file_wrapper.c", "./KernelSU/kernel/infra/file_wrapper.c"]:
            if os.path.exists(path):
                with open(path, "w") as f:
                    f.write("""
                    #include <linux/version.h>
                    #include <linux/types.h>
                    #include <linux/fs.h>
                    
                    int ksu_init_file_wrapper(void) { return 0; }
                    void ksu_exit_file_wrapper(void) {}
                    """)
                print("Safely stubbed file_wrapper.c at:", path)
        '

        # Safely stub out seccomp_cache.c for kernel 4.19
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/infra/seccomp_cache.c", "./KernelSU/kernel/infra/seccomp_cache.c"]:
            if os.path.exists(path):
                with open(path, "w") as f:
                    f.write("""
                    #include <linux/version.h>
                    #include <linux/types.h>
                    
                    int ksu_init_seccomp_cache(void) { return 0; }
                    void ksu_exit_seccomp_cache(void) {}
                    """)
                print("Safely stubbed seccomp_cache.c at:", path)
        '

        # Safely stub out pkg_observer.c for kernel 4.19
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/manager/pkg_observer.c", "./KernelSU/kernel/manager/pkg_observer.c"]:
            if os.path.exists(path):
                with open(path, "w") as f:
                    f.write("""
                    #include <linux/version.h>
                    #include <linux/types.h>
                    
                    int ksu_init_pkg_observer(void) { return 0; }
                    void ksu_exit_pkg_observer(void) {}
                    """)
                print("Safely stubbed pkg_observer.c at:", path)
        '

        # Safely stub out dynamic_manager.c for kernel 4.19
        python3 -c '
        import os
        for path in ["./drivers/kernelsu/manager/dynamic_manager.c", "./KernelSU/kernel/manager/dynamic_manager.c"]:
            if os.path.exists(path):
                with open(path, "w") as f:
                    f.write("""
                    #include <linux/version.h>
                    #include <linux/types.h>
                    
                    int ksu_init_dynamic_manager(void) { return 0; }
                    void ksu_exit_dynamic_manager(void) {}
                    """)
                print("Safely stubbed dynamic_manager.c at:", path)
        '

        echo "[-] Cloning and applying SUSFS patches for Non-GKI kernel..."
        git clone https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd --depth 1 SUSFS
        chmod +x ./SUSFS/Patches/susfs_inline_hook_patches.sh
        ./SUSFS/Patches/susfs_inline_hook_patches.sh

        echo "[-] Bypassing strict manual hook check for older kernel..."
        if [ -f "./drivers/kernelsu/tools/manual_hook_check.mk" ]; then
          echo "# Bypassed manual hook check" > ./drivers/kernelsu/tools/manual_hook_check.mk
        elif [ -f "./KernelSU/kernel/tools/manual_hook_check.mk" ]; then
          echo "# Bypassed manual hook check" > ./KernelSU/kernel/tools/manual_hook_check.mk
        fi

        echo "[-] Creating ksu_stub.c to permanently resolve undefined symbols..."
        cat << 'EOF' > fs/ksu_stub.c
        #include <linux/types.h>
        void ksu_handle_post_execveat_sucompat(void) {
            // Stub definition to satisfy linker for FinaSU hook in fs/exec.c
        }
        EOF

        if [ -f "fs/Makefile" ]; then
          if ! grep -q "ksu_stub.o" fs/Makefile; then
            echo "obj-y += ksu_stub.o" >> fs/Makefile
          fi
        fi

        mkdir -p arch/arm64/configs
        TOUCHDIRT_CFG="arch/arm64/configs/touchdirt.config"
        if [ ! -f "$TOUCHDIRT_CFG" ]; then
          touch "$TOUCHDIRT_CFG"
        fi

        # Enforcing required configurations
        for cfg in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_THREAD_INFO_IN_TASK CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_SUCOMPAT CONFIG_KSU_SUSFS; do
          grep -q "$cfg=" "$TOUCHDIRT_CFG" || echo "$cfg=y" >> "$TOUCHDIRT_CFG"
        done

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev gcc g++ clang python3 \
          libncurses5-dev ccache make git zip wget xz-utils \
          device-tree-compiler libfdt-dev gcc-arm-linux-gnueabi cpio

    - name: Prepare Toolchains directories
      run: |
        mkdir -p toolchain/gcc
        mkdir -p toolchain/clang

    - name: Download GCC & Clang Toolchain
      run: |
        cd toolchain/gcc
        wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
        tar -xf gcc.tar.xz -C ./

        cd ../clang
        wget -q --show-progress \
          https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
        mkdir -p host/linux-x86/clang-r383902
        tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

    - name: Set Environment Variables
      run: |
        CLANG_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
        GCC_PATH="$(pwd)/toolchain/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin"

        echo "$CLANG_PATH" >> $GITHUB_PATH

        echo "CROSS_COMPILE=$GCC_PATH/aarch64-none-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KCFLAGS=-w -I$(pwd)/out/security/selinux -I$(pwd)/security/selinux/include -I$(pwd)/security/selinux/ss -I$(pwd)/out/security/selinux/ss" >> $GITHUB_ENV
        echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $GITHUB_ENV

    - name: Configure and Compile Kernel
      run: |
        make -C $(pwd) O=$(pwd)/out touchdirt-a04_defconfig

        if [ -f "arch/arm64/configs/touchdirt.config" ]; then
          ./scripts/kconfig/merge_config.sh -O "$(pwd)/out" "$(pwd)/out/.config" arch/arm64/configs/touchdirt.config
        fi

        make -C $(pwd) O=$(pwd)/out olddefconfig

        for cfg in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_THREAD_INFO_IN_TASK CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_SUCOMPAT CONFIG_KSU_SUSFS; do
          sed -i "s/# $cfg is not set/$cfg=y/g" out/.config
          grep -q "$cfg=y" out/.config || echo "$cfg=y" >> out/.config
        done

        sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' out/.config || true

        VERSION_STRING="${{ inputs.version }}"
        if [ -z "$VERSION_STRING" ]; then
          VERSION_STRING="BETA"
        fi

        sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-TouchDirt-FinaSU-SUSFS-$VERSION_STRING\"/" out/.config

        make -C $(pwd) O=$(pwd)/out olddefconfig

        make -C $(pwd) O=$(pwd)/out prepare
        make -C $(pwd) O=$(pwd)/out scripts
        make -C $(pwd) O=$(pwd)/out headers_install
        make -C $(pwd) O=$(pwd)/out security/

        make -C $(pwd) O=$(pwd)/out -j$(nproc) \
          KSU_REQUIRE_PREINIT=1 \
          KSU_EXPECTED_SIZE2=0x02cc \
          KSU_EXPECTED_HASH2=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
          KSU_SECOND_SIGNATURE_RELEASE=1 || \
        make -C $(pwd) O=$(pwd)/out -j1 \
          KSU_REQUIRE_PREINIT=1 \
          KSU_EXPECTED_SIZE2=0x02cc \
          KSU_EXPECTED_HASH2=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
          KSU_SECOND_SIGNATURE_RELEASE=1

    - name: Get kernel version
      id: version
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="BETA"
        fi
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Package AnyKernel3
      run: |
        DATE=$(date -u +"%Y-%m-%d")

        git clone https://github.com/Halk56855/AnyKernel3-a04.git --depth 1 AnyKernel3

        cp out/arch/arm64/boot/Image AnyKernel3/Image

        cd AnyKernel3
        zip -r9 "../TouchDirt-FinaSU-SUSFS-${{ steps.version.outputs.version }}-${DATE}.zip" . -x ".git/*"

    - name: Upload AnyKernel3 ZIP
      uses: actions/upload-artifact@v4
      with:
        name: TouchDirt-FinaSU-SUSFS-Enforcing
        path: TouchDirt-*.zip
